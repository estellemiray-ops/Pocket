:root{

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 0}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.top h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0;color:var(--muted)}
.mswitch{display:flex;align-items:center;gap:10px}
.mswitch .lbl{font-weight:600;font-size:16px;text-align:center;white-space:nowrap;padding:0 2px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.ibtn:disabled{opacity:.35}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:26px;font-weight:800;display:block;line-height:1;text-box:trim-both cap alphabetic}
.ring .c small{position:absolute;left:0;right:0;top:calc(50% + 17px);font-size:12.5px;color:var(--muted);line-height:1}
.hero .facts{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.fact{display:contents}
.fact small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2;text-box:trim-both cap alphabetic}
.fact b{font-size:21px;font-weight:700;display:block;line-height:1;text-box:trim-both cap alphabetic}
.facts>.fact:first-child>b{margin-top:1px}
.facts>.fact:nth-child(2)>small{margin-top:-1px}
.facts>.fact:nth-child(2)>b{margin-top:1px}
.fact small.foot{margin-top:-1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 11px;border-radius:999px;background:var(--soft)}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.daygrp{margin-bottom:6px}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 6px}
.entry{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:16px;width:100%;text-align:left}
.entry:active{background:var(--soft)}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ico svg.i{width:24px;height:24px}
.entry .t{flex:1;min-width:0}
.entry .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t small{color:var(--muted);font-size:12.5px}
.entry .a{font-weight:600;font-variant-numeric:tabular-nums}
.entry .a.inc{color:var(--green-ink)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .ico{margin:0 auto 10px;width:56px;height:56px;background:var(--soft)}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(226,87,76,.4);z-index:5}
.fab svg.i{width:28px;height:28px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:4}
.nav button{flex:1;max-width:180px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--ink)}
.nav button.on svg.i{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:44px;font-weight:700;margin:6px 0 14px}
.amt span{color:var(--muted);font-weight:500}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt input{-moz-appearance:textfield;appearance:textfield;width:4.2ch;border:0;background:none;font-size:44px;font-weight:700;text-align:left;outline:none;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;font-size:11.5px;text-align:center;border:2px solid transparent}
.cat.on{border-color:var(--ink);background:var(--soft)}
.field{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field input,.field select{flex:1;border:0;background:none;outline:none;min-width:0}
.field svg.i{color:var(--muted)}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;margin-top:6px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent)}
.row2{display:flex;gap:10px}
.share{background:var(--soft);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.share-h{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:10px}
.chips{display:flex;gap:6px;align-items:center}
.chips button{flex:1;padding:8px 0;border-radius:10px;background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--ink);color:var(--bg)}
.chips label{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:10px;padding:0 8px;font-size:13.5px;color:var(--muted)}
.chips input{width:3ch;border:0;background:none;outline:none;padding:8px 0;text-align:right;font-weight:600;-moz-appearance:textfield}
.chips input::-webkit-outer-spin-button,.chips input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.share .field{background:var(--card);margin:10px 0 0}
.split{font-size:13px;color:var(--muted);margin-top:8px}
.split b{color:var(--ink);font-weight:700}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.sugg button{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.kpi b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-row .ico{width:34px;height:34px}
.bar-row .ico svg.i{width:19px;height:19px}
.bar-row .m{flex:1;min-width:0}
.bar-row .m div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar-row .m div:first-child span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
.track{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chart text{fill:var(--muted);font-size:11px;font-family:Nunito,ui-rounded,sans-serif}
.note{font-size:14px;line-height:1.45;color:var(--ink)}
.note b{font-weight:600}
.insights li{margin:8px 0}
.insights{padding-left:18px;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.chg.up{color:var(--accent)} .chg.down{color:var(--green-ink)}
.iconpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.iconpick button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.iconpick button.on{background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set-row:last-child{border-bottom:0}
.set-row .t{flex:1}
textarea{width:100%;min-height:120px;border-radius:14px;border:0;background:var(--soft);padding:12px;font:13px ui-monospace,monospace;color:var(--ink);outline:none}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent-2)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Pocket</h1>
      <div class="sync" id="sync"><i></i><span>This device</span></div>
    </div>
    <div class="mswitch">
      <button class="ibtn" id="prevM" aria-label="Previous month"></button>
      <div class="lbl" id="mLabel"></div>
      <button class="ibtn" id="nextM" aria-label="Next month"></button>
    </div>
  </div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Add entry"></button>
<nav class="nav">
  <button data-tab="home" class="on"></button>
  <button data-tab="stats"></button>
  <button data-tab="settings"></button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

let S = {v:1, allowance:1800, cycleDay:30, monthAllowance:{}, cats:DEFAULT_CATS.slice(), entries:[], updatedAt:0};
const LS_KEY='pocket-1800-v1';

// ---------- date helpers (dates only, no time of day is ever stored) ----------
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const ymOf=ds=>ds.slice(0,7);
const curYM=()=>today().slice(0,7);
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const cycDay=()=>Math.min(31,Math.max(1,Number(S.cycleDay)||30));
function startOf(key){const [y,m]=key.split('-').map(Number);return `${key}-${pad(Math.min(cycDay(),new Date(y,m,0).getDate()))}`}
function periodOf(ds){const key=ds.slice(0,7);return ds>=startOf(key)?key:shiftYM(key,-1)}
const _pd={};function periodDays(key){const ck=key+'|'+cycDay();if(_pd[ck])return _pd[ck];const end=startOf(shiftYM(key,1));const [y,m,d]=startOf(key).split('-').map(Number);const dt=new Date(y,m-1,d),out=[];
  for(let s=fmt(dt);s<end;dt.setDate(dt.getDate()+1),s=fmt(dt))out.push(s);return _pd[ck]=out}
const curP=()=>periodOf(today());
const shortDate=ds=>{const [y,m,d]=ds.split('-').map(Number);return `${d} ${MONTHS[m-1].slice(0,3)}`};
function pLabel(key,short){if(cycDay()===1)return ymLabel(key,short);const ds=periodDays(key);return short?shortDate(ds[0]):`${shortDate(ds[0])} – ${shortDate(ds[ds.length-1])}`}
const shiftYM=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function ymLabel(ym,short){const [y,m]=ym.split('-').map(Number);return short?MONTHS[m-1].slice(0,3):`${MONTHS[m-1]} ${y}`}
const dowOf=ds=>{const [y,m,d]=ds.split('-').map(Number);return (new Date(y,m-1,d).getDay()+6)%7}; // Mon=0
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dayLabel=ds=>{if(ds===today())return 'Today';const t=new Date();t.setDate(t.getDate()-1);
  if(ds===`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`)return 'Yesterday';
  const [y,m,d]=ds.split('-').map(Number);return `${DOW[dowOf(ds)]}, ${d} ${MONTHS[m-1].slice(0,3)}`};
const rs=n=>(Math.round(n)<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

let viewYM=curP(), tab='home';

// ---------- storage: claude db (synced, private to you) + local backup ----------
let db=null, docRef=null, saving=false, pending=false, saveTimer=null;
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);if(d&&d.entries)S=normalize(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function normalize(d){d.cats=d.cats&&d.cats.length?d.cats:DEFAULT_CATS.slice();d.monthAllowance=d.monthAllowance||{};d.allowance=Number(d.allowance)||1800;d.cycleDay=Number(d.cycleDay)||30;d.entries=d.entries||[];return d}
function persist(){S.updatedAt=Date.now();saveLocal();if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){if(!docRef)return;if(saving){pending=true;return}saving=true;
  try{await docRef.set(JSON.parse(JSON.stringify(S)));setSync(true)}catch(e){setSync(false,'Saved on this device')}
  saving=false;if(pending){pending=false;flush()}}
function setSync(ok,msg){const el=document.getElementById('sync');el.className='sync'+(ok?' ok':'');el.querySelector('span').textContent=msg||(ok?'Synced':'This device')}
async function initDb(){
  try{
    const [dbx,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
    if(!dbx||!user)return;
    const id=await user.id(); if(!id)return;
    db=dbx; docRef=db.collection('data/users/'+id).doc('state');
    let remote=null;
    await Promise.race([(async()=>{const snap=await docRef.get();remote=snap&&(typeof snap.data==='function'?snap.data():snap);})(),new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
    if(remote&&remote.entries&&(remote.updatedAt||0)>=(S.updatedAt||0)){S=normalize(remote);saveLocal();render()}
    else if(S.entries.length||S.updatedAt){await flush()}
    setSync(true);
  }catch(e){setSync(false)}
}

const monthEntries=ym=>S.entries.filter(e=>periodOf(e.date)===ym);
function monthSummary(ym){
  const es=monthEntries(ym), exp=es.filter(e=>e.type!=='inc'), inc=es.filter(e=>e.type==='inc');
  const others=exp.reduce((a,e)=>a+forOthers(e),0),spent=exp.reduce((a,e)=>a+e.amt,0), extra=inc.reduce((a,e)=>a+e.amt,0), budget=allowanceFor(ym)+extra;
  return {es,exp,inc,spent,extra,budget,others,left:budget-spent};
}
const tint=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
const icoBox=(c,size)=>`<span class="ico" style="background:${tint(c.color,.14)};color:${c.color}${size?`;width:${size}px;height:${size}px`:''}">${ic(c.icon)}</span>`;
const monthsWithData=()=>{const s=new Set(S.entries.map(e=>periodOf(e.date)));s.add(curP());return [...s].sort()};

// ---------- render ----------
function render(){
  document.getElementById('mLabel').textContent=pLabel(viewYM);
  document.getElementById('nextM').disabled=viewYM>=curP();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.getElementById('fab').classList.toggle('hidden',tab==='settings');
  const v=document.getElementById('view');
  v.innerHTML= tab==='home'?renderHome(): tab==='stats'?renderStats():renderSettings();
}

function ring(pct,color,size=132,stroke=12,op=0){
  const r=(size-stroke)/2, C=2*Math.PI*r, p=Math.max(0,Math.min(1,pct)), q=Math.max(0,Math.min(1-p,op));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/>
   ${q>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sun)" stroke-width="${stroke}" stroke-linecap="round"
     stroke-dasharray="${C*q} ${C}" stroke-dashoffset="${-C*p}"/>`:''}
   ${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
     stroke-dasharray="${C*p} ${C}" />`:''}</svg>`;
}

function dayProgress(ym){const days=periodDays(ym),dim=days.length,c=curP();if(ym<c)return {elapsed:dim,remaining:0,dim,days};if(ym>c)return{elapsed:0,remaining:dim,dim,days};
  const i=days.indexOf(today());return {elapsed:i+1,remaining:dim-i,dim,days}}

function renderHome(){
  const m=monthSummary(viewYM), dp=dayProgress(viewYM);
  const leftPct=m.budget>0?m.left/m.budget:0;
  const color=m.left<0?'var(--accent)':leftPct<.2?'var(--warn)':'var(--accent-2)';
  const perDay=dp.remaining>0?Math.max(0,m.left)/dp.remaining:0;
  const isCur=viewYM===curP();
  let html=`<div class="card"><div class="hero">
    <div class="ring">${ring(leftPct,color,132,12,m.budget>0?m.others/m.budget:0)}<div class="c"><b>${rs(m.left)}</b><small>${m.left<0?'over budget':'left'}</small></div></div>
    <div class="facts">
      <div class="fact"><small>Spent of ${rs(m.budget)}</small><b>${rs(m.spent)}</b></div>
      ${isCur?`<div class="fact"><small>Safe to spend / day</small><b>${rs(perDay)}</b></div>
      <div class="fact"><small class="foot">${dp.remaining} day${dp.remaining===1?'':'s'} to go · resets ${shortDate(startOf(shiftYM(viewYM,1)))}</small></div>`:
      `<div class="fact"><small>${m.left>=0?'Saved this cycle':'Overspent by'}</small><b style="color:${m.left>=0?'var(--green-ink)':'var(--accent)'}">${rs(Math.abs(m.left))}</b></div>`}
    </div></div>
    ${m.extra||m.others?`<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${m.extra?`<span class="pill">${ic('hand-coins')} ${rs(allowanceFor(viewYM))} allowance + ${rs(m.extra)} extra</span>`:''}${m.others?`<span class="pill"><i style="width:10px;height:10px;border-radius:50%;background:var(--sun);display:inline-block"></i> ${rs(m.others)} of it for others</span>`:''}</div>`:''}
  </div>`;
  const sorted=m.es.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.seq||0)-(a.seq||0));
  html+=`<div class="sec-title"><span>Entries</span><span>${m.exp.length} spent${m.inc.length?` · ${m.inc.length} in`:''}</span></div>`;
  if(!sorted.length){html+=`<div class="card empty"><div class="ico">${ic('piggy-bank')}</div>Nothing yet for ${pLabel(viewYM)}.<br>Tap <b>+</b> when money goes out.</div>`;return html}
  const groups={};sorted.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  html+='<div class="card" style="padding:8px 10px">';
  for(const [d,list] of Object.entries(groups)){
    const tot=list.filter(e=>e.type!=='inc').reduce((a,e)=>a+e.amt,0);
    html+=`<div class="daygrp"><div class="dayhead"><span>${dayLabel(d)}</span><span>${tot?'−'+rs(tot):''}</span></div>`;
    list.forEach(e=>{const c=catById(e.cat);html+=`<button class="entry" data-edit="${e.id}">${icoBox(c)}
      <div class="t"><b>${esc(e.note||c.name)}</b><small>${esc([e.note?c.name:'',e.share?`${e.share}% for ${e.who||'someone else'}`:''].filter(Boolean).join(' · '))}</small></div>
      <div class="a ${e.type==='inc'?'inc':''}">${e.type==='inc'?'+':'−'}${rs(e.amt)}</div></button>`});
    html+='</div>';
  }
  return html+'</div>';
}

// ---------- stats ----------
function renderStats(){
  const ym=viewYM, m=monthSummary(ym), dp=dayProgress(ym), dim=dp.dim;
  const exp=m.exp;
  if(!S.entries.length) return `<div class="card empty"><div class="ico">${ic('chart-pie')}</div>Stats appear once you add a few entries.</div>`;
  const elapsed=Math.max(1,dp.elapsed);
  const avgDay=m.spent/elapsed;
  const projected=ym===curP()?avgDay*dim:m.spent;
  const daysWithSpend=new Set(exp.map(e=>e.date));
  const noSpend=Math.max(0,dp.elapsed-daysWithSpend.size);
  const biggest=exp.slice().sort((a,b)=>b.amt-a.amt)[0];
  const avgEntry=exp.length?m.spent/exp.length:0;
  // streak of no-spend days ending today (current month)
  let streak=0;if(ym===curP()){for(let i=dp.elapsed-1;i>=0;i--){if(daysWithSpend.has(dp.days[i]))break;streak++}}
  // biggest spending day
  const byDay={};exp.forEach(e=>byDay[e.date]=(byDay[e.date]||0)+e.amt);
  const topDay=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  // previous month
  const prev=monthSummary(shiftYM(ym,-1));

  let h=`<div class="kpis">
    <div class="kpi"><small>Spent</small><b>${rs(m.spent)}</b><em>${m.budget?Math.round(m.spent/m.budget*100):0}% of ${rs(m.budget)}</em></div>
    <div class="kpi"><small>${ym===curP()?'Projected by reset':'Total spent'}</small><b style="color:${projected>m.budget&&!(ym===curP()&&dp.elapsed<7)?'var(--accent)':'inherit'}">${rs(projected)}</b><em>${ym===curP()&&dp.elapsed<7?'rough guess — too early to tell':projected>m.budget?rs(projected-m.budget)+' over':rs(m.budget-projected)+' to spare'}</em></div>
    <div class="kpi"><small>Average per day</small><b>${rs(avgDay)}</b><em>ideal ${rs(m.budget/dim)}</em></div>
    <div class="kpi"><small>Entries</small><b>${exp.length}</b><em>avg ${rs(avgEntry)} each</em></div>
    <div class="kpi"><small>No-spend days</small><b>${noSpend}</b><em>${ym===curP()?`current streak ${streak}`:`of ${dim} days`}</em></div>
    ${m.others?`<div class="kpi"><small>For others</small><b>${rs(m.others)}</b><em>${Math.round(m.others/m.spent*100)}% of spending</em></div><div class="kpi"><small>On yourself</small><b>${rs(m.spent-m.others)}</b><em>${Math.round((m.spent-m.others)/m.spent*100)}% of spending</em></div>`:''}
    <div class="kpi"><small>vs last time</small><b>${prev.spent?(m.spent>=prev.spent?'+':'−')+Math.abs(Math.round((m.spent-prev.spent)/prev.spent*100))+'%':'—'}</b><em>${pLabel(shiftYM(ym,-1),1)}: ${rs(prev.spent)}</em></div>
  </div>`;

  // insights
  const ins=[];
  if(biggest){const c=catById(biggest.cat);ins.push(`Biggest single expense: <b>${rs(biggest.amt)}</b> on ${esc(biggest.note||c.name)} (${dayLabel(biggest.date)}).`)}
  if(topDay)ins.push(`Heaviest day: <b>${dayLabel(topDay[0])}</b> at ${rs(topDay[1])}.`);
  const catTot={};exp.forEach(e=>catTot[e.cat]=(catTot[e.cat]||0)+e.amt);
  const catSorted=Object.entries(catTot).sort((a,b)=>b[1]-a[1]);
  if(catSorted[0])ins.push(`<b>${esc(catById(catSorted[0][0]).name)}</b> takes the biggest bite — ${Math.round(catSorted[0][1]/m.spent*100)}% of what you spent.`);
  const catCnt={};exp.forEach(e=>catCnt[e.cat]=(catCnt[e.cat]||0)+1);
  const freq=Object.entries(catCnt).sort((a,b)=>b[1]-a[1])[0];
  if(freq&&freq[1]>1)ins.push(`Most frequent: <b>${esc(catById(freq[0]).name)}</b>, ${freq[1]} times.`);
  if(ym===curP()&&m.left>0&&avgDay>0){const idx=dp.elapsed-1+Math.floor(m.left/avgDay);
    ins.push(idx>=dim?`At this pace the money lasts until it resets.`:`At this pace the money runs out around <b>${shortDate(dp.days[idx])}</b>.`)}
  if(ins.length)h+=`<div class="card"><ul class="insights note">${ins.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;

  // category breakdown
  if(catSorted.length){
    h+=`<div class="sec-title"><span>Where it went</span></div><div class="card">${donut(catSorted,m.spent)}`;
    const prevCat={};prev.exp.forEach(e=>prevCat[e.cat]=(prevCat[e.cat]||0)+e.amt);
    catSorted.forEach(([id,v])=>{const c=catById(id),p=v/m.spent;const pv=prevCat[id]||0;
      const chg=pv?Math.round((v-pv)/pv*100):null;
      h+=`<div class="bar-row">${icoBox(c)}<div class="m"><div><span>${esc(c.name)} <small style="color:var(--muted)">· ${catCnt[id]}× ${chg!==null?`<span class="chg ${chg>0?'up':'down'}">${chg>0?'▲':'▼'}${Math.abs(chg)}%</span>`:''}</small></span><span>${rs(v)}</span></div>
        <div class="track"><i style="width:${p*100}%;background:${c.color}"></i></div></div></div>`});
    h+=`</div>`;
  }

  // burn chart
  h+=`<div class="sec-title"><span>Pace through the month</span></div><div class="card">${burnChart(ym,m,dim,dp)}</div>`;
  // daily bars
  h+=`<div class="sec-title"><span>Day by day</span></div><div class="card">${dailyBars(dp.days,byDay,m.budget/dim)}</div>`;
  // weekday
  h+=`<div class="sec-title"><span>By weekday</span><span style="text-transform:none;letter-spacing:0">all months</span></div><div class="card">${weekdayChart()}</div>`;
  if(m.others){const who={};exp.filter(e=>e.share>0).forEach(e=>{const k=(e.who||'Someone else').trim();const kk=k.toLowerCase();who[kk]=who[kk]||{name:k,t:0,n:0};who[kk].t+=forOthers(e);who[kk].n++});
    const list=Object.values(who).sort((a,b)=>b.t-a.t),mx=list[0].t;
    h+=`<div class="sec-title"><span>Spent on others</span></div><div class="card" style="padding:8px 14px">`;
    list.forEach(p=>{h+=`<div class="bar-row"><span class="ico" style="background:${tint('#d4627f',.14)};color:#d4627f">${ic('heart')}</span><div class="m"><div><span>${esc(p.name)} <small style="color:var(--muted)">· ${p.n}×</small></span><span>${rs(p.t)}</span></div><div class="track"><i style="width:${p.t/mx*100}%;background:#d4627f"></i></div></div></div>`});
    const allOthers=S.entries.reduce((a,e)=>a+forOthers(e),0);
    h+=`<div class="note" style="color:var(--muted);font-size:13px;margin:6px 2px 8px">All time on others: ${rs(allOthers)}</div></div>`}
  // top items
  const items={};S.entries.filter(e=>e.type!=='inc'&&e.note).forEach(e=>{const k=e.note.trim().toLowerCase();items[k]=items[k]||{name:e.note.trim(),n:0,t:0,cat:e.cat};items[k].n++;items[k].t+=e.amt});
  const topItems=Object.values(items).sort((a,b)=>b.t-a.t).slice(0,8);
  if(topItems.length){h+=`<div class="sec-title"><span>Top things you buy</span><span style="text-transform:none;letter-spacing:0">all time</span></div><div class="card" style="padding:8px 14px">`;
    topItems.forEach(it=>{const c=catById(it.cat);h+=`<div class="bar-row">${icoBox(c)}<div class="m"><div><span>${esc(it.name)} <small style="color:var(--muted)">· ${it.n}×, avg ${rs(it.t/it.n)}</small></span><span>${rs(it.t)}</span></div></div></div>`});
    h+='</div>'}
  // history
  h+=`<div class="sec-title"><span>Month by month</span></div><div class="card">${historyChart()}${historyTable()}</div>`;
  return h;
}

function donut(catSorted,total){
  const size=170,r=64,sw=22,C=2*Math.PI*r;let off=0;
  const segs=catSorted.map(([id,v])=>{const c=catById(id),len=v/total*C;const s=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="${c.color}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
  return `<div style="display:flex;justify-content:center;margin:4px 0 6px;position:relative">
   <svg width="${size}" height="${size}" viewBox="0 0 170 170" style="transform:rotate(-90deg)">${segs}</svg>
   <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><b style="font-size:20px">${rs(total)}</b><br><small style="color:var(--muted)">${catSorted.length} categories</small></div></div></div>`;
}

function burnChart(ym,m,dim,dp){
  const W=520,H=180,L=36,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B;
  const byDay=Array(dim+1).fill(0);const pos={};dp.days.forEach((d,i)=>pos[d]=i+1);m.exp.forEach(e=>{if(pos[e.date])byDay[pos[e.date]]+=e.amt});
  const upto=dp.elapsed;
  let cum=0;const pts=[[0,0]];for(let d=1;d<=upto;d++){cum+=byDay[d];pts.push([d,cum])}
  const max=Math.max(m.budget,cum,1)*1.05;
  const x=d=>L+d/dim*iw, y=v=>T+ih-v/max*ih;
  const path=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const area=path+` L${x(upto)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const ticks=[0,.5,1].map(f=>max/1.05*f);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?(t/1000).toFixed(1)+'k':Math.round(t)}</text>`).join('');
  [1,8,15,22,dim].forEach(d=>g+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${Number(dp.days[d-1].slice(8))}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(dim)}" y2="${y(m.budget)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <line x1="${L}" x2="${W-R}" y1="${y(m.budget)}" y2="${y(m.budget)}" stroke="var(--accent)" stroke-opacity=".5" stroke-width="1"/>
    <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${upto?`<circle cx="${x(upto)}" cy="${y(cum)}" r="4" fill="var(--accent)"/>`:''}
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>Your spending</span><span><i style="background:var(--muted)"></i>Even pace</span><span><i style="background:var(--accent);opacity:.5"></i>Budget</span></div>`;
}

function dailyBars(days,byDay,ideal){
  const dim=days.length,W=520,H=140,L=8,R=8,T=8,B=20,iw=W-L-R,ih=H-T-B;
  const vals=days.map(d=>byDay[d]||0);
  const max=Math.max(...vals,ideal,1)*1.1, bw=iw/dim;
  const y=v=>T+ih-v/max*ih;
  let s='';vals.forEach((v,i)=>{if(v>0)s+=`<rect x="${L+i*bw+bw*.15}" y="${y(v)}" width="${bw*.7}" height="${T+ih-y(v)}" rx="${Math.min(3,bw*.3)}" fill="${v>ideal*2?'var(--accent)':'var(--ink)'}" fill-opacity="${v>ideal*2?1:.75}"/>`});
  [1,8,15,22,dim].forEach(d=>s+=`<text x="${L+(d-.5)*bw}" y="${H-5}" text-anchor="middle">${Number(days[d-1].slice(8))}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%"><line x1="${L}" x2="${W-R}" y1="${y(ideal)}" y2="${y(ideal)}" stroke="var(--muted)" stroke-dasharray="4 4"/>${s}<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/></svg>
  <div class="legend"><span><i style="background:var(--muted)"></i>Daily even pace ${rs(ideal)}</span><span><i style="background:var(--accent)"></i>More than double</span></div>`;
}

function weekdayChart(){
  const tot=Array(7).fill(0),cnt=Array(7).fill(0);
  S.entries.filter(e=>e.type!=='inc').forEach(e=>{const d=dowOf(e.date);tot[d]+=e.amt;cnt[d]++});
  const max=Math.max(...tot,1);
  const top=tot.indexOf(Math.max(...tot));
  return DOW.map((d,i)=>`<div class="bar-row" style="margin:7px 0"><span style="width:34px;font-size:13px;color:var(--muted)">${d}</span><div class="m"><div class="track" style="height:10px"><i style="width:${tot[i]/max*100}%;background:${i===top?'var(--accent)':'var(--ink)'};opacity:${i===top?1:.6}"></i></div></div><span style="width:70px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums">${rs(tot[i])}</span></div>`).join('')
   +`<div class="note" style="color:var(--muted);font-size:13px;margin-top:8px">${tot[top]?`${DOW[top]}s are your spendiest day (${cnt[top]} entries).`:''}</div>`;
}

function historyChart(){
  const months=monthsWithData().slice(-8);
  const W=520,H=150,L=8,R=8,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const data=months.map(ym=>({ym,...monthSummary(ym)}));
  const max=Math.max(...data.map(d=>Math.max(d.spent,d.budget)),1)*1.08;
  const bw=iw/months.length, y=v=>T+ih-v/max*ih;
  let s='';data.forEach((d,i)=>{const cx=L+i*bw+bw/2,w=Math.min(34,bw*.55);
    s+=`<rect x="${cx-w/2}" y="${y(d.budget)}" width="${w}" height="${T+ih-y(d.budget)}" rx="6" fill="var(--soft)"/>`;
    s+=`<rect x="${cx-w/2}" y="${y(d.spent)}" width="${w}" height="${T+ih-y(d.spent)}" rx="6" fill="${d.spent>d.budget?'var(--accent)':'var(--accent-2)'}"/>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" ${d.ym===viewYM?'style="fill:var(--ink);font-weight:700"':''}>${pLabel(d.ym,1)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${s}</svg><div class="legend"><span><i style="background:var(--accent-2)"></i>Spent (within budget)</span><span><i style="background:var(--accent)"></i>Over</span><span><i style="background:var(--soft);height:8px"></i>Budget</span></div>`;
}
function historyTable(){
  const months=monthsWithData().filter(ym=>ym<curP());
  let saved=0,spentAll=0;months.forEach(ym=>{const s=monthSummary(ym);saved+=s.left;spentAll+=s.spent});
  const allMonths=monthsWithData();const avg=allMonths.length?allMonths.reduce((a,ym)=>a+monthSummary(ym).spent,0)/allMonths.length:0;
  let best=null;months.forEach(ym=>{const s=monthSummary(ym);if(!best||s.left>best.left)best={ym,left:s.left}});
  return `<table class="tbl" style="margin-top:12px">
   <tr><td>Average spent per month</td><td>${rs(avg)}</td></tr>
   ${months.length?'':'<!--'}<tr><td>Saved in finished months</td><td style="color:${saved>=0?'var(--green-ink)':'var(--accent)'}">${rs(saved)}</td></tr>${months.length?'':'-->'}
   ${best?`<tr><td>Best month</td><td>${pLabel(best.ym)} (${rs(best.left)} left)</td></tr>`:''}
   <tr><td>Total ever tracked</td><td>${rs(S.entries.filter(e=>e.type!=='inc').reduce((a,e)=>a+e.amt,0))}</td></tr>
  </table>`;
}

// ---------- settings ----------
function renderSettings(){
  return `<div class="sec-title"><span>Money</span></div><div class="card">
    <div class="note" style="margin-bottom:10px">Money arrives (and the limit resets) on day</div>
    <div class="field">${ic('calendar-blank')}<input id="cyc" type="number" inputmode="numeric" min="1" max="31" value="${cycDay()}"><span style="color:var(--muted);font-size:13px">of each month</span></div>
    <div class="note" style="margin:6px 0 10px">Allowance each time</div>
    <div class="field">${ic('wallet')}<span>₹</span><input id="allow" type="number" inputmode="numeric" value="${S.allowance}"></div>
    <div class="note" style="color:var(--muted);font-size:13px;margin:-2px 2px 10px">Used for every month unless you change just one month below.</div>
    <div class="field">${ic('calendar')}<span style="white-space:nowrap">${pLabel(viewYM)}: ₹</span><input id="allowM" type="number" inputmode="numeric" value="${allowanceFor(viewYM)}"></div>
    <button class="btn ghost" id="saveAllow">Save</button>
  </div>
  <div class="sec-title"><span>Categories</span><button class="pill" id="addCat">${ic('plus')} New</button></div>
  <div class="card" style="padding:6px 14px">${S.cats.map(c=>`<button class="set-row" data-cat="${c.id}">${icoBox(c)}<span class="t">${esc(c.name)}</span>${ic('caret-right')}</button>`).join('')}</div>
  <div class="sec-title"><span>Backup</span></div><div class="card">
    <div class="note" style="color:var(--muted);font-size:13px;margin-bottom:10px">Your data is private to you. Copy a backup now and then, or a CSV to open in a spreadsheet.</div>
    <div class="row2"><button class="btn ghost" id="copyCsv">${''}Copy CSV</button><button class="btn ghost" id="copyJson">Copy backup</button></div>
    <button class="btn ghost" id="restore" style="margin-top:10px">Restore from backup</button>
  </div>
  <div class="note" style="text-align:center;color:var(--muted);font-size:12px;margin:20px 0">Icons by Lucide (ISC). Only dates are recorded — never the time of day.</div>`;
}

// ---------- sheets ----------
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;scrim.classList.add('open')}
function closeSheet(){scrim.classList.remove('open')}
scrim.addEventListener('click',e=>{if(e.target===scrim)closeSheet()});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}

let draft=null;
function openEntry(id){
  const e=id?S.entries.find(x=>x.id===id):null;
  const defDate=viewYM===curP()?today():periodDays(viewYM)[0];
  draft=e?{...e}:{id:null,type:'exp',amt:'',cat:S.cats[0]?.id||'other',note:'',date:defDate};
  drawEntry();
  setTimeout(()=>{const a=document.getElementById('amt');if(a&&!id)a.focus()},120);
}
function shareBlock(){
  const sh=Number(draft.share)||0, amt=parseFloat(draft.amt)||0;
  const names=[...new Set(S.entries.filter(x=>x.who).slice(-60).reverse().map(x=>x.who.trim()))].slice(0,6);
  return `<div class="share"><div class="share-h">${ic('users-three')}<span>How much of this was for someone else?</span></div>
   <div class="chips">${[0,25,50,75,100].map(p=>`<button data-share="${p}" class="${sh===p?'on':''}">${p}%</button>`).join('')}
   <label><input id="sharep" type="number" inputmode="numeric" min="0" max="100" value="${[0,25,50,75,100].includes(sh)?'':sh}" placeholder="__">%</label></div>
   ${sh>0?`<div class="field">${ic('heart')}<input id="who" placeholder="Who for? (optional)" value="${esc(draft.who||'')}" maxlength="30"></div>
   ${names.length?`<div class="sugg" style="margin:8px 0 0">${names.map(n=>`<button data-who="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
   ${amt?`<div class="split"><b>${rs(amt*sh/100)}</b> for them · <b>${rs(amt-amt*sh/100)}</b> for you</div>`:''}`:''}</div>`;
}
function drawEntry(){
  const isInc=draft.type==='inc';
  const notes=[...new Set(S.entries.filter(x=>x.cat===draft.cat&&x.note&&x.type!=='inc').slice(-40).reverse().map(x=>x.note.trim()))].slice(0,6);
  openSheet(`<h2>${draft.id?'Edit entry':'New entry'}<button class="ibtn" data-close>${ic('x')}</button></h2>
   <div class="seg"><button data-type="exp" class="${!isInc?'on':''}">Spent</button><button data-type="inc" class="${isInc?'on':''}">Got extra</button></div>
   <div class="amt"><span>₹</span><input id="amt" type="number" inputmode="decimal" placeholder="0" value="${draft.amt}" style="width:${Math.max(2,String(draft.amt).length+.6)}ch"></div>
   ${isInc?'':`<div class="cats">${S.cats.map(c=>`<button class="cat ${draft.cat===c.id?'on':''}" data-pick="${c.id}">${icoBox(c)}<span>${esc(c.name)}</span></button>`).join('')}</div>`}
   <div class="field">${ic('notebook-pen')}<input id="note" placeholder="${isInc?'From whom? (optional)':'What was it? e.g. chicken strips'}" value="${esc(draft.note)}" maxlength="60"></div>
   ${!isInc&&notes.length?`<div class="sugg">${notes.map(n=>`<button data-sugg="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
   ${isInc?'':shareBlock()}
   <div class="field">${ic('calendar')}<input id="date" type="date" value="${draft.date}" max="${today()}"></div>
   <button class="btn" id="saveEntry">${draft.id?'Save changes':'Add'}</button>
   ${draft.id?`<button class="btn danger" id="delEntry">${''}Delete entry</button>`:''}`);
}
document.addEventListener('input',e=>{if(e.target.id==='amt')e.target.style.width=Math.max(2,e.target.value.length+.6)+'ch'});
document.addEventListener('change',e=>{if(e.target.id==='sharep'||(e.target.id==='amt'&&Number(draft&&draft.share)>0)){const st=sheet.scrollTop;readDraftFields();drawEntry();sheet.scrollTop=st}});
function readDraftFields(){const a=document.getElementById('amt'),n=document.getElementById('note'),d=document.getElementById('date');
  if(a)draft.amt=a.value;if(n)draft.note=n.value;if(d)draft.date=d.value||today();
  const sp=document.getElementById('sharep'),w=document.getElementById('who');if(sp&&sp.value!=='')draft.share=Math.max(0,Math.min(100,Math.round(Number(sp.value)||0)));if(w)draft.who=w.value}

function saveEntry(){
  readDraftFields();const amt=Math.round(parseFloat(draft.amt)*100)/100;
  if(!(amt>0)){toast('Enter an amount');return}
  const rec={id:draft.id||uid(),type:draft.type,amt,cat:draft.type==='inc'?'_inc':draft.cat,note:draft.note.trim(),date:draft.date,seq:draft.seq||Date.now(),share:draft.type==='inc'?0:(Number(draft.share)||0),who:(Number(draft.share)>0?(draft.who||'').trim():'')};
  if(draft.id){const i=S.entries.findIndex(x=>x.id===draft.id);S.entries[i]=rec}else S.entries.push(rec);
  persist();closeSheet();viewYM=periodOf(rec.date);render();toast(draft.id?'Updated':'Added '+rs(amt));
}

let catDraft=null;
function openCat(id){
  const c=id?S.cats.find(x=>x.id===id):null;
  catDraft=c?{...c}:{id:null,name:'',icon:'sparkle',color:COLORS[S.cats.length%COLORS.length]};drawCat();
}
function drawCat(){
  const used=S.entries.filter(e=>e.cat===catDraft.id).length;
  openSheet(`<h2>${catDraft.id?'Edit category':'New category'}<button class="ibtn" data-close>${ic('x')}</button></h2>
   <div style="display:flex;justify-content:center;margin:4px 0 12px">${icoBox(catDraft,64)}</div>
   <div class="field">${ic('tag')}<input id="cname" placeholder="Name, e.g. Lipstick" value="${esc(catDraft.name)}" maxlength="20"></div>
   <div class="swatches">${COLORS.map(c=>`<button data-color="${c}" class="${catDraft.color===c?'on':''}" style="background:${c}"></button>`).join('')}</div>
   <div class="iconpick">${PICKABLE.map(n=>`<button data-icon="${n}" class="${catDraft.icon===n?'on':''}" aria-label="${n}">${ic(n)}</button>`).join('')}</div>
   <button class="btn" id="saveCat">Save</button>
   ${catDraft.id?`<button class="btn danger" id="delCat">Delete category${used?` (${used} entries move to Other)`:''}</button>`:''}`);
}

function confirmSheet(msg,yes,fn){openSheet(`<h2>${msg}</h2><button class="btn" id="cfYes" style="background:var(--accent);color:#fff">${yes}</button><button class="btn ghost" data-close>Cancel</button>`);document.getElementById('cfYes').onclick=()=>{fn();closeSheet()}}

function toCsv(){const rows=[['date','type','amount','category','note','% for others','for whom']];S.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,e.type==='inc'?'extra':'spent',e.amt,catById(e.cat).name,e.note||'',e.share||0,e.who||'']));
  return rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n')}
async function copy(t,label){try{await navigator.clipboard.writeText(t);toast(label+' copied')}catch(e){openSheet(`<h2>Copy this<button class="ibtn" data-close>${ic('x')}</button></h2><textarea readonly>${esc(t)}</textarea>`)}}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.close!==undefined){closeSheet();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.edit){openEntry(t.dataset.edit);return}
  if(t.dataset.type){readDraftFields();draft.type=t.dataset.type;if(draft.type==='exp'&&draft.cat==='_inc')draft.cat=S.cats[0]?.id;drawEntry();return}
  if(t.dataset.pick){readDraftFields();draft.cat=t.dataset.pick;drawEntry();return}
  if(t.dataset.share!==undefined){const sp=document.getElementById('sharep');if(sp)sp.value='';readDraftFields();draft.share=Number(t.dataset.share);const st=sheet.scrollTop;drawEntry();sheet.scrollTop=st;return}
  if(t.dataset.who){document.getElementById('who').value=t.dataset.who;return}
  if(t.dataset.sugg){document.getElementById('note').value=t.dataset.sugg;return}
  if(t.dataset.cat){openCat(t.dataset.cat);return}
  if(t.dataset.icon){catDraft.name=document.getElementById('cname').value;catDraft.icon=t.dataset.icon;const st=sheet.scrollTop;drawCat();sheet.scrollTop=st;return}
  if(t.dataset.color){catDraft.name=document.getElementById('cname').value;catDraft.color=t.dataset.color;drawCat();return}
  switch(t.id){
    case 'fab':openEntry();break;
    case 'prevM':viewYM=shiftYM(viewYM,-1);render();break;
    case 'nextM':if(viewYM<curP()){viewYM=shiftYM(viewYM,1);render()}break;
    case 'saveEntry':saveEntry();break;
    case 'delEntry':{const id=draft.id;confirmSheet('Delete this entry?','Delete',()=>{S.entries=S.entries.filter(x=>x.id!==id);persist();render();toast('Deleted')});break}
    case 'addCat':openCat();break;
    case 'saveCat':{const n=document.getElementById('cname').value.trim();if(!n){toast('Give it a name');break}
      catDraft.name=n;if(catDraft.id){const i=S.cats.findIndex(c=>c.id===catDraft.id);S.cats[i]=catDraft}else{catDraft.id='c'+uid();S.cats.push(catDraft)}
      persist();closeSheet();render();break}
    case 'delCat':{const id=catDraft.id;confirmSheet(`Delete “${esc(catDraft.name)}”?`,'Delete',()=>{
      if(!S.cats.find(c=>c.id==='other'))S.cats.push(DEFAULT_CATS.find(c=>c.id==='other'));
      S.entries.forEach(x=>{if(x.cat===id)x.cat='other'});S.cats=S.cats.filter(c=>c.id!==id);persist();render()});break}
    case 'saveAllow':{const a=Number(document.getElementById('allow').value),am=Number(document.getElementById('allowM').value);
      const cy=Number(document.getElementById('cyc').value);if(cy>=1&&cy<=31&&cy!==cycDay()){S.cycleDay=cy;viewYM=curP()}
      if(a>0)S.allowance=a; if(am>0&&am!==S.allowance)S.monthAllowance[viewYM]=am;else delete S.monthAllowance[viewYM];
      persist();render();toast('Saved');break}
    case 'copyCsv':copy(toCsv(),'CSV');break;
    case 'copyJson':copy(JSON.stringify(S),'Backup');break;
    case 'restore':openSheet(`<h2>Restore<button class="ibtn" data-close>${ic('x')}</button></h2><div class="note" style="color:var(--muted);font-size:13px;margin-bottom:8px">Paste a backup. This replaces everything currently here.</div><textarea id="rtext"></textarea><button class="btn" id="doRestore">Restore</button>`);break;
    case 'doRestore':{try{const d=JSON.parse(document.getElementById('rtext').value);if(!d.entries)throw 0;S=normalize(d);persist();closeSheet();render();toast('Restored')}catch(err){toast('That doesn’t look like a backup')}break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&scrim.classList.contains('open')&&document.getElementById('saveEntry')&&e.target.tagName==='INPUT'){e.preventDefault();saveEntry()}});

document.getElementById('prevM').innerHTML=ic('caret-left');
document.getElementById('nextM').innerHTML=ic('chevron-right');
document.getElementById('fab').innerHTML=ic('plus');
const navB=document.querySelectorAll('.nav button');
navB[0].innerHTML=ic('house')+'Home';navB[1].innerHTML=ic('chart-pie')+'Stats';navB[2].innerHTML=ic('gear')+'Settings';

loadLocal();render();initDb();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
// roll over to the new month automatically if the app stays open
setInterval(()=>{if(viewYM>curP())viewYM=curP();},60000);
</script>
</body>
</html>
